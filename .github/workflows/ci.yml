name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Verify Sync and Consistency
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Step order is load-bearing and mirrors scripts/git-pre-commit.sh:
    #   check formatting -> sync modules -> reformat -> require zero diff
    #
    # Prettier re-indents the embedded <style>/<script> blocks that the sync
    # scripts paste in, so `sync` alone can never reproduce a committed
    # template. Measured 2026-10-11: this repo's CI ran `sync -> git diff`
    # without the prettier steps, so it failed on every push — the sync scripts
    # re-emit unformatted blocks that no longer match the prettier-formatted
    # committed files. Do not reorder these steps.
    #
    # Prettier is pinned so a new release cannot silently change the expected
    # formatting. Bump it here and in scripts/git-pre-commit.sh together.
    - name: Verify Code Formatting with Prettier
      run: npx --yes prettier@3.9.9 --check "templates/html/*.html"

    - name: Run Sync Scripts
      run: |
        python scripts/sync_theme.py
        python scripts/sync_export.py

    - name: Format Synced Templates with Prettier
      run: npx --yes prettier@3.9.9 --write "templates/html/*.html"

    - name: Check for Uncommitted Sync Changes
      run: |
        git diff --exit-code || (echo "ERROR: Templates are out of sync with components. Run scripts/git-pre-commit.sh locally and commit the result!" && exit 1)

    # One portable kit, one per-repo config — see archviz-diagram's ADR-003.
    # The check set and its size are NOT described here on purpose — run
    # `python3 scripts/check_archviz.py --list` for the truth. ADR-003 says the
    # authority is `--list`, not this comment; a prose count drifts the moment
    # a check is added, and this line has already drifted once.
    - name: Verify Consistency Kit
      run: python3 scripts/check_archviz.py

    # A checker is only a gate if its own failure modes are tested. Runs the
    # adversarial fixtures: every check exercised in both polarities, including
    # the cases that must NOT fire.
    - name: Verify Consistency Kit Checker
      run: python3 scripts/check_archviz.py --self-test

    # Verifies the manifest is installable, not just present. The `deps` check
    # inside the kit already fails on an undeclared import; this step catches
    # what it structurally cannot — a declared name that does not resolve, or a
    # specifier no release satisfies.
    - name: Install declared dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Byte-compilation used to be its own `compileall -q scripts archviz3d`
    # step here. It now lives in the consistency kit's `pycompile` check, which
    # walks the whole repo rather than two directories and uses the builtin
    # `compile()`, so it leaves no `__pycache__` in the tree it inspects.
    # Measured 2026-10-09: the narrow version could not see examples/ or
    # templates/python/, and the family's only broken file lived in one of them.
